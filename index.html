<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>RoutePilot — Real-Time Road &amp; Bridge Hazard Detection with Intelligent Route Diversion System</title>
    <meta name="description" content="RoutePilot monitors road and bridge hazards in real time and dynamically diverts vehicles with intelligent multi-route analysis." />
    <meta property="og:title" content="RoutePilot — Real-Time Road &amp; Bridge Hazard Detection System" />
    <meta property="og:description" content="Real-Time Road &amp; Bridge Hazard Detection with Intelligent Route Diversion System" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var t = localStorage.getItem('routepilot_app_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', t);
          if (t === 'light') {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-[#0D1117] text-slate-100 antialiased overflow-hidden selection:bg-[#AEF5F0] selection:text-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
